<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronograma – Paróquia São Francisco de Assis</title>
<style>
:root{--m:#6b1d1d;--m2:#8a2b2b;--w:#fff;--bg:#faf5f3;--ln:#e6d5d0;--ok:#1d6b3a;--bad:#b00020;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:#2b1a1a;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:0 auto;min-height:100vh}
header{background:var(--m);color:var(--w);padding:16px 14px 12px;text-align:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:17px;margin:0;letter-spacing:.5px}
.bal{margin:10px auto 0;background:var(--w);color:var(--m);border-radius:12px;padding:8px 12px;font-weight:700}
.bal small{display:block;font-weight:400;opacity:.8}
.bal.ok b{color:var(--ok)}.bal.bad b{color:var(--bad)}
.tabs{display:flex;gap:8px;padding:12px 14px 4px}
.tabs button{flex:1;padding:10px;border:2px solid var(--m);background:var(--w);color:var(--m);border-radius:10px;font-weight:700;font-size:15px}
.tabs button.on{background:var(--m);color:var(--w)}
.wrap{padding:8px 14px 40px}
.tl{border-left:3px solid var(--m);margin-left:6px;padding-left:14px}
.card{background:var(--w);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:12px 0;position:relative}
.card:before{content:"";position:absolute;left:-23px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--m);border:2px solid var(--w)}
.card.al{background:#f3e3df;border-color:var(--m2)}.card.al:before{background:var(--w);border-color:var(--m)}
.t{font-size:13px;color:var(--m2);font-weight:700}.d{font-weight:600;margin:2px 0 6px}
.row{display:flex;justify-content:space-between;font-size:13px;gap:8px}.row span:last-child{font-weight:600}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.obs{background:var(--m);color:var(--w);border-radius:12px;padding:12px;margin-top:18px;white-space:pre-wrap}
.obs h3{margin:0 0 4px;font-size:14px}
button.b{background:var(--m);color:var(--w);border:0;border-radius:9px;padding:9px 12px;font-size:14px;font-weight:600;margin:4px 4px 0 0}
button.b.l{background:var(--w);color:var(--m);border:1.5px solid var(--m)}
button.b.x{background:var(--bad)}
input,select,textarea{font:inherit;padding:9px;border:1.5px solid var(--ln);border-radius:9px;width:100%;margin:4px 0}
label{font-size:13px;font-weight:600;color:var(--m)}
.box{background:var(--w);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:14px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.top{display:flex;justify-content:flex-end;padding:8px 14px 0}.top a{color:var(--m);font-weight:700;font-size:14px;text-decoration:none;border:1.5px solid var(--m);border-radius:9px;padding:5px 10px}
.mod{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.mod>div{background:var(--w);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.mod h3{margin:0 0 8px;color:var(--m)}
.opt{display:block;width:100%;text-align:left;padding:11px;margin:6px 0;border:2px solid var(--ln);border-radius:10px;background:var(--w);font-size:15px}
.opt.on{border-color:var(--m);background:#f3e3df;font-weight:700}
.msg{text-align:center;padding:30px 16px;color:var(--m)}
</style></head><body>
<div id="app"><div class="msg">Carregando…</div></div>
<script>
const NOME="PARÓQUIA SÃO FRANCISCO DE ASSIS";
const PIN="1515";let unlocked=false;try{unlocked=sessionStorage.getItem("adm")==="1"}catch(e){}
let db=null,col=null,canEdit=false,events=[],day="sab",mode=location.hash==="#admin"?"admin":"user",modal=null,loaded=false;
const DN={sab:"Sábado",dom:"Domingo"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toS=t=>{if(!t)return null;const[a,b,c]=t.split(":").map(Number);return a*3600+b*60+(c||0)};
const p2=n=>String(n).padStart(2,"0");
const hms=s=>{s=Math.abs(Math.round(s));return p2(Math.floor(s/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60)};
const sgn=s=>s===0?"00:00:00":(s>0?"+":"−")+hms(s);
const cls=s=>s>0?"pos":s<0?"neg":"";
const full=t=>t&&t.length===5?t+":00":t;
const now=()=>new Date().toTimeString().slice(0,8);
const list=()=>events.filter(e=>e.day===day&&e.type!=="obs").sort((a,b)=>toS(a.start)-toS(b.start));
const evs=()=>list().filter(e=>e.type==="ev");
const dur=e=>toS(e.end)-toS(e.start);
const real=e=>e.realStart&&e.realEnd?toS(e.realEnd)-toS(e.realStart):null;
const upd=(id,d)=>db.doc("cron/"+id).update(d);
const msg=t=>{modal={t:"info",text:t};render()};

function balance(){
  const done=evs().filter(e=>e.realEnd);
  if(!done.length)return`<div class="bal"><small>Saldo do dia</small><b>Aguardando início</b></div>`;
  const e=done[done.length-1],b=toS(e.end)-toS(e.realEnd);
  const txt=b>0?"Tempo sobrando: "+hms(b):b<0?"Atrasado: "+hms(b):"Exatamente no horário";
  return`<div class="bal ${b>=0?"ok":"bad"}"><small>Saldo do dia (último evento finalizado)</small><b>${txt}</b></div>`;
}
function card(e,adm){
  if(e.type==="al")return`<div class="card al"><div class="t">🔔 ${e.start}</div><div class="d">${esc(e.desc)}</div>${adm?`<button class="b l" data-a="edit" data-id="${e.id}">Editar</button><button class="b x" data-a="del" data-id="${e.id}">Excluir</button>`:""}</div>`;
  const r=real(e),res=r!=null?dur(e)-r:null;
  let h=`<div class="card"><div class="t">${e.start} → ${e.end}</div><div class="d">${esc(e.desc)}</div>
  <div class="row"><span>Programado</span><span>${hms(dur(e))}</span></div>`;
  if(e.realStart)h+=`<div class="row"><span>Início real</span><span>${e.realStart}</span></div>`;
  if(e.realEnd)h+=`<div class="row"><span>Fim real</span><span>${e.realEnd}</span></div>`;
  if(r!=null)h+=`<div class="row"><span>Realizado</span><span>${hms(r)}</span></div><div class="row"><span>Resultado</span><span class="${cls(res)}">${sgn(res)}</span></div>`;
  else if(e.realStart)h+=`<div class="row"><span>Situação</span><span>Em andamento</span></div>`;
  if(adm){
    if(!e.realStart)h+=`<button class="b" data-a="s-now" data-id="${e.id}">Iniciar agora</button><button class="b l" data-a="s-sch" data-id="${e.id}">No agendado</button><button class="b l" data-a="s-typ" data-id="${e.id}">Digitar início</button>`;
    else if(!e.realEnd)h+=`<button class="b" data-a="end" data-id="${e.id}">Finalizar</button>`;
    if(e.realStart)h+=`<button class="b l" data-a="reset" data-id="${e.id}">Desfazer</button>`;
    h+=`<button class="b l" data-a="edit" data-id="${e.id}">Editar</button><button class="b x" data-a="del" data-id="${e.id}">Excluir</button>`;
  }
  return h+"</div>";
}
function obsText(){const o=events.find(e=>e.id==="obs_"+day);return o?o.text:""}
function render(){
  const app=$("#app");
  if(!loaded){return}
  if(!db){app.innerHTML=`<div class="msg">Entre na sua conta Claude para ver o cronograma.</div>`;return}
  if(mode==="admin"&&canEdit&&!unlocked){app.innerHTML=`<header><h1>${NOME}</h1></header><div class="wrap"><div class="box"><b>Área do administrador</b><label>PIN de acesso</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><div id="pinerr" class="neg"></div><button class="b" data-a="pin">Entrar</button><button class="b l" data-a="back">Voltar</button></div></div>`;return}
  const adm=mode==="admin"&&canEdit;
  let h=`<header><h1>${NOME}</h1>${balance()}</header>`;
  if(canEdit)h+=`<div class="top"><a href="#${adm?"":"admin"}" id="sw">${adm?"Ver como usuário":"Área do administrador"}</a></div>`;
  h+=`<div class="tabs">${["sab","dom"].map(d=>`<button class="${d===day?"on":""}" data-a="day" data-d="${d}">${DN[d]}</button>`).join("")}</div><div class="wrap">`;
  const L=list();
  h+=L.length?`<div class="tl">${L.map(e=>card(e,adm)).join("")}</div>`:`<div class="msg">Nenhum evento cadastrado para ${DN[day]}.</div>`;
  const ot=obsText();
  if(ot&&!adm)h+=`<div class="obs"><h3>Observações</h3>${esc(ot)}</div>`;
  if(adm){
    h+=`<div class="box"><b>Novo evento – ${DN[day]}</b><label>Descrição</label><input id="ed" placeholder="Ex.: Missa de abertura">
    <div class="g2"><div><label>Hora inicial</label><input id="es" type="time" step="1" value="08:00:00"></div><div><label>Hora final</label><input id="ee" type="time" step="1" value="09:00:00"></div></div>
    <div class="row" id="pv"></div><button class="b" data-a="add">Cadastrar evento</button></div>
    <div class="box"><b>Novo alerta – ${DN[day]}</b><label>Descrição do alerta</label><input id="ad"><label>Horário</label><input id="at" type="time" step="1" value="08:00:00"><button class="b" data-a="addal">Cadastrar alerta</button></div>
    <div class="box"><b>Observações – ${DN[day]}</b><textarea id="ob" rows="4" placeholder="Aparece no final da linha do tempo do usuário">${esc(ot)}</textarea><button class="b" data-a="obs">Salvar observações</button></div>
    <div class="box"><b>Dados</b><br><button class="b l" data-a="reset-all">Restaurar cronograma original</button></div>`;
  }
  h+="</div>";
  if(modal)h+=modalHtml();
  const keep=document.activeElement&&document.activeElement.id;
  const vals={};document.querySelectorAll("#app input,#app textarea").forEach(i=>{if(i.id)vals[i.id]=i.value});
  app.innerHTML=h;
  Object.entries(vals).forEach(([k,v])=>{const i=document.getElementById(k);if(i)i.value=v});
  prev();
}
function prev(){const a=$("#es"),b=$("#ee"),p=$("#pv");if(a&&b&&p){const d=toS(full(b.value))-toS(full(a.value));p.innerHTML=`<span>Tempo total</span><span class="${d<0?"neg":""}">${isNaN(d)?"--":sgn(d).replace("+","")}</span>`}}
function nextEv(id){const L=evs();const i=L.findIndex(e=>e.id===id);return L.slice(i+1).find(e=>!e.realStart)}
function modalHtml(){
  const m=modal,e=events.find(x=>x.id===m.id);let b="";
  if(m.t==="end"){
    const o=[["now","Nesse Momento"],["sch","No Horário Agendado ("+e.end+")"],["typ","Digitar"]];
    b=`<h3>Horário finalizado</h3>${o.map(([k,l])=>`<button class="opt ${m.c===k?"on":""}" data-a="ch" data-c="${k}">${l}</button>`).join("")}
    ${m.c==="typ"?`<input id="mv" type="time" step="1" value="${now()}">`:""}
    <button class="b" data-a="end-ok">OK</button><button class="b l" data-a="close">Cancelar</button>`;
  }else if(m.t==="s-typ"){
    b=`<h3>Horário de início</h3><input id="mv" type="time" step="1" value="${now()}"><button class="b" data-a="s-ok">OK</button><button class="b l" data-a="close">Cancelar</button>`;
  }else if(m.t==="next"){
    const n=events.find(x=>x.id===m.nid);
    b=`<h3>Próximo evento</h3><p>Iniciar “${esc(n.desc)}” quando?</p>
    <button class="opt ${m.c==="after"?"on":""}" data-a="nc" data-c="after">Imediatamente após o anterior (${m.end})</button>
    <button class="opt ${m.c==="typ"?"on":""}" data-a="nc" data-c="typ">Digitar o horário inicial</button>
    ${m.c==="typ"?`<input id="mv" type="time" step="1" value="${n.start}">`:""}
    <button class="b" data-a="next-ok">OK</button><button class="b l" data-a="close">Agora não</button>`;
  }
  else if(m.t==="rall"){b=`<h3>Restaurar original</h3><p>Isto apaga tudo (inclusive horários reais) e recarrega o cronograma das planilhas.</p><button class="b x" data-a="rall-ok">Restaurar</button><button class="b l" data-a="close">Cancelar</button>`}
  else if(m.t==="info"){b=`<h3>Aviso</h3><p>${esc(m.text)}</p><button class="b" data-a="close">OK</button>`}
  else if(m.t==="del"){b=`<h3>Excluir</h3><p>Excluir “${esc(e.desc)}”? Não dá para desfazer.</p><button class="b x" data-a="del-ok">Excluir</button><button class="b l" data-a="close">Cancelar</button>`}
  else if(m.t==="edit"){const al=e.type==="al";b=`<h3>Editar ${al?"alerta":"evento"}</h3><label>Descrição</label><input id="d2" value="${esc(e.desc)}"><div class="g2"><div><label>${al?"Horário":"Hora inicial"}</label><input id="s2" type="time" step="1" value="${e.start}"></div>${al?"":`<div><label>Hora final</label><input id="f2" type="time" step="1" value="${e.end}"></div>`}</div>${al?"":`<div class="g2"><div><label>Início real</label><input id="rs2" type="time" step="1" value="${e.realStart||""}"></div><div><label>Fim real</label><input id="re2" type="time" step="1" value="${e.realEnd||""}"></div></div>`}<button class="b" data-a="edit-ok">Salvar</button><button class="b l" data-a="close">Cancelar</button>`}
  return`<div class="mod"><div>${b}</div></div>`;
}
document.addEventListener("input",e=>{if(e.target.id==="es"||e.target.id==="ee")prev()});
window.addEventListener("hashchange",()=>{mode=location.hash==="#admin"?"admin":"user";render()});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a,id=t.dataset.id,D=t.dataset;
  try{
  if(a==="pin"){if($("#pin").value===PIN){unlocked=true;try{sessionStorage.setItem("adm","1")}catch(x){}render()}else{$("#pin").value="";$("#pinerr").textContent="PIN incorreto."}}
  else if(a==="back"){location.hash=""}
  else if(a==="day"){day=D.d;render()}
  else if(a==="close"){modal=null;render()}
  else if(a==="s-now"){await upd(id,{realStart:now()})}
  else if(a==="s-sch"){await upd(id,{realStart:events.find(x=>x.id===id).start})}
  else if(a==="s-typ"){modal={t:"s-typ",id};render()}
  else if(a==="s-ok"){await upd(modal.id,{realStart:full($("#mv").value)});modal=null;render()}
  else if(a==="end"){modal={t:"end",id,c:"now"};render()}
  else if(a==="ch"){modal.c=D.c;render()}
  else if(a==="end-ok"){
    const ev=events.find(x=>x.id===modal.id);
    const v=modal.c==="now"?now():modal.c==="sch"?ev.end:full($("#mv").value);
    await upd(ev.id,{realEnd:v});
    const n=nextEv(ev.id);
    modal=n?{t:"next",id:ev.id,nid:n.id,end:v,c:"after"}:null;render();
  }
  else if(a==="nc"){modal.c=D.c;render()}
  else if(a==="next-ok"){
    const v=modal.c==="after"?modal.end:full($("#mv").value);
    await upd(modal.nid,{realStart:v});modal=null;render();
  }
  else if(a==="reset"){await upd(id,{realStart:null,realEnd:null})}
  else if(a==="del"){modal={t:"del",id};render()}
  else if(a==="reset-all"){modal={t:"rall"};render()}
  else if(a==="rall-ok"){store=seed();save();sync();modal=null;render()}
  else if(a==="del-ok"){await db.doc("cron/"+modal.id).delete();modal=null;render()}
  else if(a==="edit"){modal={t:"edit",id};render()}
  else if(a==="edit-ok"){const ev=events.find(x=>x.id===modal.id);const d=$("#d2").value.trim(),st=full($("#s2").value);if(!d||!st)return msg("Preencha descrição e horário.");const u={desc:d,start:st};if(ev.type==="ev"){const f=full($("#f2").value);if(!f||toS(f)<=toS(st))return msg("A hora final deve ser maior que a inicial.");u.end=f;u.realStart=$("#rs2").value?full($("#rs2").value):null;u.realEnd=$("#re2").value?full($("#re2").value):null}await upd(ev.id,u);modal=null;render()}
  else if(a==="add"){
    const d=$("#ed").value.trim(),s=full($("#es").value),f=full($("#ee").value);
    if(!d||!s||!f)return msg("Preencha descrição e horários.");
    if(toS(f)<=toS(s))return msg("A hora final deve ser maior que a inicial.");
    await db.doc("cron/ev"+Date.now()).set({type:"ev",day,desc:d,start:s,end:f});$("#ed").value="";
  }
  else if(a==="addal"){
    const d=$("#ad").value.trim(),s=full($("#at").value);
    if(!d||!s)return msg("Preencha descrição e horário.");
    await db.doc("cron/al"+Date.now()).set({type:"al",day,desc:d,start:s});$("#ad").value="";
  }
  else if(a==="obs"){await db.doc("cron/obs_"+day).set({type:"obs",day,text:$("#ob").value});msg("Observações salvas.")}
  }catch(err){msg("Erro: "+(err.message||err.code||err))}
